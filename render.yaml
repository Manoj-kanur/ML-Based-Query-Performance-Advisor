services:
  # FastAPI ML Backend Service
  - type: web
    name: ml-query-advisor-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m src.collector.workload_gen && python -m src.models.trainer
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false

  # Next.js Frontend Dashboard
  - type: web
    name: ml-query-advisor-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: ml-query-advisor-api
          property: host
      - key: MONGODB_URI
        sync: false
